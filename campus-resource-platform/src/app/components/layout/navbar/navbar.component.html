<nav class="navbar glass-panel" aria-label="Main Top Navigation">
    <div class="nav-left">
        <!-- Mobile Drawer Toggle Button -->
        <button class="mobile-menu-btn" type="button" (click)="onMobileMenuClick()" aria-label="Open sidebar menu">
            <i data-lucide="menu"></i>
        </button>

        <div class="search-box" role="search">
            <i data-lucide="search" class="search-icon"></i>
            <input type="search" 
                   [(ngModel)]="searchValue" 
                   (keydown.enter)="goToSearch()"
                   placeholder="Search notes, subjects, exams..."
                   aria-label="Search resources">
            <kbd class="search-kbd" title="Press Cmd+K or Ctrl+K to search">⌘K</kbd>
            <button type="button" class="search-submit-btn" (click)="goToSearch()" aria-label="Submit search">
                Go
            </button>
        </div>
    </div>

    <div class="nav-right">
        <!-- Theme Toggle -->
        <button class="nav-icon-btn" 
                type="button" 
                (click)="toggleTheme()" 
                [attr.aria-label]="(themeService.isDark$ | async) ? 'Switch to light mode' : 'Switch to dark mode'">
            <i [attr.data-lucide]="(themeService.isDark$ | async) ? 'sun' : 'moon'"></i>
        </button>

        <!-- Notifications Dropdown (When Logged In) -->
        <div class="notifications-wrap" *ngIf="isAuthenticated">
            <button class="nav-icon-btn" 
                    type="button" 
                    (click)="toggleNotifications($event)" 
                    aria-label="View notifications">
                <i data-lucide="bell"></i>
                <span class="notification-dot" aria-hidden="true"></span>
            </button>

            <div class="notifications-menu glass-panel" *ngIf="showNotifications" (click)="$event.stopPropagation()">
                <div class="notif-header">
                    <h4>Notifications</h4>
                    <span class="badge public">New</span>
                </div>
                <div class="notif-list">
                    <div class="notif-item">
                        <div class="notif-dot"></div>
                        <div class="notif-text">
                            <p><strong>Calculus II Notes</strong> received 5 new downloads.</p>
                            <small>15m ago</small>
                        </div>
                    </div>
                    <div class="notif-item">
                        <div class="notif-dot"></div>
                        <div class="notif-text">
                            <p>New study materials added in <strong>Computer Science</strong>.</p>
                            <small>2h ago</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- User Profile Dropdown Menu (When Logged In) -->
        <div class="account-menu-wrap" *ngIf="isAuthenticated">
            <button class="profile-dropdown" 
                    type="button" 
                    (click)="toggleAccountMenu($event)"
                    [attr.aria-expanded]="showAccountMenu"
                    aria-haspopup="true">
                <img [src]="'https://ui-avatars.com/api/?name=' + (userProfile.name || 'User') + '&background=6366f1&color=fff&size=80'"
                     [alt]="userProfile.name" 
                     class="avatar"
                     width="36"
                     height="36">
                <div class="user-info">
                    <span class="user-name">{{userProfile.name}}</span>
                </div>
                <i data-lucide="chevron-down" class="chevron-icon"></i>
            </button>

            <div class="account-menu glass-panel" 
                 *ngIf="showAccountMenu" 
                 (click)="$event.stopPropagation()"
                 role="menu">
                <div class="menu-user-header">
                    <div class="menu-user-name">{{userProfile.name}}</div>
                    <div class="menu-user-email">{{userProfile.email || userProfile.university}}</div>
                </div>

                <div class="menu-divider"></div>

                <button type="button" class="menu-item" (click)="openProfileEditor()" role="menuitem">
                    <i data-lucide="user"></i>
                    <span>Profile & Settings</span>
                </button>

                <div class="theme-selector">
                    <span class="theme-label">Theme</span>
                    <div class="theme-pill-group">
                        <button type="button" 
                                class="theme-pill" 
                                [class.active]="themeService.currentMode === 'dark'"
                                (click)="setThemeMode('dark')">
                            Dark
                        </button>
                        <button type="button" 
                                class="theme-pill" 
                                [class.active]="themeService.currentMode === 'light'"
                                (click)="setThemeMode('light')">
                            Light
                        </button>
                        <button type="button" 
                                class="theme-pill" 
                                [class.active]="themeService.currentMode === 'system'"
                                (click)="setThemeMode('system')">
                            Auto
                        </button>
                    </div>
                </div>

                <div class="menu-divider"></div>

                <button type="button" class="menu-item danger" (click)="logout()" role="menuitem">
                    <i data-lucide="log-out"></i>
                    <span>Sign Out</span>
                </button>
            </div>
        </div>

        <!-- Guest Actions (When Not Logged In) -->
        <div class="guest-auth-actions" *ngIf="!isAuthenticated">
            <a routerLink="/login" class="btn-secondary nav-login-btn">
                <i data-lucide="log-in"></i>
                <span>Sign In</span>
            </a>
            <a routerLink="/signup" class="btn-primary nav-signup-btn">
                <span>Join</span>
            </a>
        </div>
    </div>
</nav>
