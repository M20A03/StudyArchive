<nav class="navbar glass-panel">
    <div class="nav-left">
        <button type="button" class="mobile-menu-btn" (click)="toggleMobileSidebar()" title="Toggle Navigation">
            <i data-lucide="menu"></i>
        </button>

        <div class="search-box">
            <i data-lucide="search"></i>
            <input type="text" [(ngModel)]="searchValue" (keydown.enter)="goToSearch()"
                placeholder="Search resources, topics, or subjects...">
            <button type="button" class="search-hint" (click)="goToSearch()">Go</button>
        </div>
    </div>

    <div class="nav-right">
        <!-- Professional Theme Toggle Key -->
        <button class="nav-icon-btn theme-toggle-btn" type="button" (click)="toggleTheme()"
            [title]="isLightTheme ? 'Switch to Dark Mode' : 'Switch to Light Mode'">
            <i [attr.data-lucide]="isLightTheme ? 'sun' : 'moon'"></i>
            <span class="theme-label">{{ isLightTheme ? 'Light' : 'Dark' }}</span>
        </button>

        <!-- Notifications (When Signed In) -->
        <button class="nav-icon-btn" type="button" (click)="toggleNotifications()" *ngIf="isLoggedIn" title="Notifications">
            <i data-lucide="bell"></i>
            <span class="notification-dot" *ngIf="!showNotifications"></span>
        </button>

        <!-- Logged In Account Dropdown -->
        <div class="account-menu-wrap" *ngIf="isLoggedIn; else guestActions">
            <button class="profile-dropdown" type="button" (click)="toggleAccountMenu($event)">
                <img [src]="'https://ui-avatars.com/api/?name=' + (userProfile.name || 'User') + '&background=6d7cff&color=fff'"
                    alt="Profile" class="avatar">
                <div class="user-info">
                    <span class="user-name">{{userProfile.name}}</span>
                </div>
                <i data-lucide="chevron-down"></i>
            </button>

            <div class="account-menu glass-panel" *ngIf="showAccountMenu" (click)="$event.stopPropagation()">
                <button type="button" class="menu-item" (click)="openProfileEditor()">
                    <i data-lucide="user"></i>
                    My Account
                </button>
                <div class="theme-row">
                    <button type="button" class="theme-btn" [class.active]="!isLightTheme" (click)="setTheme('dark')">
                        Dark Mode
                    </button>
                    <button type="button" class="theme-btn" [class.active]="isLightTheme" (click)="setTheme('light')">
                        Light Mode
                    </button>
                </div>
                <button type="button" class="menu-item danger" (click)="logout()">
                    <i data-lucide="log-out"></i>
                    Sign Out
                </button>
            </div>
        </div>

        <!-- Guest Visitor Buttons (Google Sign In) -->
        <ng-template #guestActions>
            <div class="guest-btn-wrap">
                <button type="button" class="btn-signin google-btn" (click)="loginWithGoogle()">
                    <svg viewBox="0 0 24 24" class="google-svg-icon" width="18" height="18">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>Google Sign In</span>
                </button>
            </div>
        </ng-template>
    </div>
</nav>

<!-- IN-WEBSITE GOOGLE AUTHENTICATION MODAL -->
<div class="modal-overlay animate-fade-in" *ngIf="showAuthModal" (click)="closeAuthModal()">
    <div class="auth-modal-content glass-panel" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <h3>Sign in to CampusShare</h3>
            <button type="button" class="close-btn" (click)="closeAuthModal()">
                <i data-lucide="x"></i>
            </button>
        </div>

        <div class="modal-body text-center">
            <p class="auth-subtitle">Instant 1-Click Access for Campus Students & Faculty</p>
            
            <div class="auth-error-badge" *ngIf="authError">
                {{ authError }}
            </div>

            <button type="button" class="google-auth-btn-large" (click)="loginWithGoogle()" [disabled]="authLoading">
                <svg viewBox="0 0 24 24" class="google-svg-icon" width="22" height="22">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                <span>{{ authLoading ? 'Connecting...' : 'Continue with Google Account' }}</span>
            </button>
        </div>
    </div>
</div>
