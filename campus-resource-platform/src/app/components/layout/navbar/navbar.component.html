<nav class="navbar glass-panel">
    <div class="nav-left">
        <button type="button" class="mobile-menu-btn" (click)="toggleMobileSidebar()" title="Toggle Navigation">
            <i data-lucide="menu"></i>
        </button>

        <div class="search-box">
            <i data-lucide="search"></i>
            <input type="text" [(ngModel)]="searchValue" (keydown.enter)="goToSearch()"
                placeholder="Search resources, topics, or subjects...">
            <button type="button" class="search-hint" (click)="goToSearch()">Go</button>
        </div>
    </div>

    <div class="nav-right">
        <!-- Professional Theme Toggle Key -->
        <button class="nav-icon-btn theme-toggle-btn" type="button" (click)="toggleTheme()"
            [title]="isLightTheme ? 'Switch to Dark Mode' : 'Switch to Light Mode'">
            <i [attr.data-lucide]="isLightTheme ? 'sun' : 'moon'"></i>
            <span class="theme-label">{{ isLightTheme ? 'Light' : 'Dark' }}</span>
        </button>

        <!-- Notifications (When Signed In) -->
        <button class="nav-icon-btn" type="button" (click)="toggleNotifications()" *ngIf="isLoggedIn" title="Notifications">
            <i data-lucide="bell"></i>
            <span class="notification-dot" *ngIf="!showNotifications"></span>
        </button>

        <!-- Logged In Account Dropdown -->
        <div class="account-menu-wrap" *ngIf="isLoggedIn; else guestActions">
            <button class="profile-dropdown" type="button" (click)="toggleAccountMenu($event)">
                <img [src]="'https://ui-avatars.com/api/?name=' + (userProfile.name || 'User') + '&background=6d7cff&color=fff'"
                    alt="Profile" class="avatar">
                <div class="user-info">
                    <span class="user-name">{{userProfile.name}}</span>
                </div>
                <i data-lucide="chevron-down"></i>
            </button>

            <div class="account-menu glass-panel" *ngIf="showAccountMenu" (click)="$event.stopPropagation()">
                <button type="button" class="menu-item" (click)="openProfileEditor()">
                    <i data-lucide="user"></i>
                    My Account
                </button>
                <div class="theme-row">
                    <button type="button" class="theme-btn" [class.active]="!isLightTheme" (click)="setTheme('dark')">
                        Dark Mode
                    </button>
                    <button type="button" class="theme-btn" [class.active]="isLightTheme" (click)="setTheme('light')">
                        Light Mode
                    </button>
                </div>
                <button type="button" class="menu-item danger" (click)="logout()">
                    <i data-lucide="log-out"></i>
                    Sign Out
                </button>
            </div>
        </div>

        <!-- Guest Visitor Buttons (In-Website Account Creation) -->
        <ng-template #guestActions>
            <div class="guest-btn-wrap">
                <button type="button" class="btn-signin" (click)="openAuthModal('login')">
                    <i data-lucide="log-in"></i>
                    <span>Sign In</span>
                </button>
                <button type="button" class="btn-register-outline" (click)="openAuthModal('register')">
                    Create Account
                </button>
            </div>
        </ng-template>
    </div>
</nav>

<!-- IN-WEBSITE AUTHENTICATION MODAL -->
<div class="modal-overlay animate-fade-in" *ngIf="showAuthModal" (click)="closeAuthModal()">
    <div class="auth-modal-content glass-panel" (click)="$event.stopPropagation()">
        <div class="modal-header">
            <div class="auth-tabs">
                <button type="button" [class.active]="authTab === 'login'" (click)="authTab = 'login'">Sign In</button>
                <button type="button" [class.active]="authTab === 'register'" (click)="authTab = 'register'">Create Account</button>
            </div>
            <button type="button" class="close-btn" (click)="closeAuthModal()">
                <i data-lucide="x"></i>
            </button>
        </div>

        <div class="modal-body">
            <div class="auth-error-badge" *ngIf="authError">
                {{ authError }}
            </div>

            <!-- LOGIN TAB -->
            <form *ngIf="authTab === 'login'" (ngSubmit)="submitLogin()">
                <div class="form-group">
                    <label>Email or Username</label>
                    <input type="text" [(ngModel)]="loginData.identifier" name="identifier" placeholder="student@university.edu">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" [(ngModel)]="loginData.password" name="password" placeholder="••••••••">
                </div>

                <button type="submit" class="btn-primary full-width" [disabled]="authLoading">
                    {{ authLoading ? 'Signing In...' : 'Sign In' }}
                </button>
            </form>

            <!-- REGISTER TAB -->
            <form *ngIf="authTab === 'register'" (ngSubmit)="submitRegister()">
                <div class="form-grid-2">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" [(ngModel)]="registerData.fullName" name="fullName" placeholder="Alex Johnson">
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" [(ngModel)]="registerData.email" name="email" placeholder="alex@university.edu">
                    </div>
                    <div class="form-group">
                        <label>University / College</label>
                        <input type="text" [(ngModel)]="registerData.college" name="college" placeholder="Stanford University">
                    </div>
                    <div class="form-group">
                        <label>Department</label>
                        <input type="text" [(ngModel)]="registerData.department" name="department" placeholder="Computer Science">
                    </div>
                    <div class="form-group">
                        <label>Semester</label>
                        <select [(ngModel)]="registerData.semester" name="semester">
                            <option>1st Semester</option>
                            <option>2nd Semester</option>
                            <option>3rd Semester</option>
                            <option>4th Semester</option>
                            <option>5th Semester</option>
                            <option>6th Semester</option>
                            <option>7th Semester</option>
                            <option>8th Semester</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" [(ngModel)]="registerData.password" name="password" placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" class="btn-primary full-width" [disabled]="authLoading">
                    {{ authLoading ? 'Creating Account...' : 'Create Account' }}
                </button>
            </form>
        </div>
    </div>
</div>
