<nav class="navbar">
    <div class="nav-left">
        <div class="search-box">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="text" [(ngModel)]="searchValue" (keydown.enter)="goToSearch()"
                placeholder="Search resources, topics, or subjects...">
            <button type="button" class="search-hint" (click)="goToSearch()">Go</button>
        </div>
    </div>

    <div class="nav-right">
        <button class="nav-icon-btn" type="button" (click)="toggleTheme()" [attr.aria-label]="isLightTheme ? 'Switch to dark mode' : 'Switch to light mode'">
            <svg *ngIf="isLightTheme" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            <svg *ngIf="!isLightTheme" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>

        <!-- Guest: Show Sign In button -->
        <button *ngIf="!isAuthenticated" class="btn-signin" type="button" (click)="loginWithGoogle()">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#fff" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/><path fill="#fff" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/></svg>
            Sign In
        </button>

        <!-- Authenticated: Show profile dropdown -->
        <div *ngIf="isAuthenticated" class="account-menu-wrap">
            <button class="profile-dropdown" type="button" (click)="toggleAccountMenu($event)">
                <img [src]="userProfile.photoURL || 'https://ui-avatars.com/api/?name=' + (userProfile.name || 'User') + '&background=6366f1&color=fff&size=80'"
                    alt="Profile" class="avatar">
                <div class="user-info">
                    <span class="user-name">{{userProfile.name}}</span>
                    <span class="user-email">{{userProfile.email}}</span>
                </div>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>

            <div class="account-menu" *ngIf="showAccountMenu" (click)="$event.stopPropagation()">
                <div class="menu-header">
                    <img [src]="userProfile.photoURL || 'https://ui-avatars.com/api/?name=' + (userProfile.name || 'User') + '&background=6366f1&color=fff&size=80'"
                        alt="Profile" class="menu-avatar">
                    <div>
                        <strong>{{userProfile.name}}</strong>
                        <span>{{userProfile.email}}</span>
                    </div>
                </div>
                <div class="menu-divider"></div>
                <button type="button" class="menu-item" (click)="openProfileEditor()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    My Account
                </button>
                <div class="theme-row">
                    <button type="button" class="theme-btn" [class.active]="!isLightTheme" (click)="setTheme('dark')">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
                        Dark
                    </button>
                    <button type="button" class="theme-btn" [class.active]="isLightTheme" (click)="setTheme('light')">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/></svg>
                        Light
                    </button>
                </div>
                <button type="button" class="menu-item" (click)="changeAccount()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
                    Switch Account
                </button>
                <div class="menu-divider"></div>
                <button type="button" class="menu-item danger" (click)="logout()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
                    Sign Out
                </button>
            </div>
        </div>
    </div>
</nav>
