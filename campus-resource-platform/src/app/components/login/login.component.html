<div class="login-container">
    <div class="animated-bg"></div>

    <div class="login-card animate-fade-in glass-panel">
        <div class="top-nav-back">
            <a routerLink="/dashboard" class="back-home-link">← Back to Platform (Browse as Guest)</a>
        </div>
        <h1>Log in to CampusShare</h1>
        <p class="subtitle">Course Management & Resource Sharing</p>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <div class="input-wrapper">
                    <input type="text" formControlName="username" placeholder=" " id="username"
                        [class.error]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
                    <label for="username">Username</label>
                </div>
            </div>

            <div class="form-group">
                <div class="input-wrapper">
                    <input type="password" formControlName="password" placeholder=" " id="password"
                        [class.error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                    <label for="password">Password</label>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-primary" [disabled]="loginForm.invalid || isLoading">
                    <span *ngIf="!isLoading">Log in</span>
                    <div *ngIf="isLoading" class="loader"></div>
                </button>
                <p class="signup-prompt">Don't have an account? <a routerLink="/signup">Sign up</a></p>
                <a href="#" class="lost-password" (click)="showLostPasswordHelp($event)">Lost password?</a>
            </div>
        </form>
    </div>
</div>
